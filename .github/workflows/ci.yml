name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm ci requires a committed root package-lock.json.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --reporter=verbose

      - name: Build client
        run: npm run build

      # Keeps the exact bundle that passed CI, useful when a Vercel
      # deploy misbehaves and you need to diff against a known-good build.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: client-dist-${{ github.sha }}
          path: packages/client/dist
          retention-days: 7
